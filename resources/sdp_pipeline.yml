resources:
  jobs:
    sdp_job_trigger:
      name: "DLT test job"

      schedule:
        quartz_cron_expression: "0 0 12 * * ?"
        timezone_id: "Europe/Madrid"
        pause_status: ${var.job_status}

      tasks:
        - task_key: run_sdp_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.sdp_pipeline.id}

  pipelines:
    sdp_pipeline:
      name: sdp_pipeline
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src"

      libraries:
        - glob:
            include: ../src/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
