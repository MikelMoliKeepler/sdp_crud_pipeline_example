# TODO: Change static info for parameters
bundle:
  name: sdp-pipeline-example

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  job_status:
    description: Schedule of the workflow (PAUSED / UNPAUSED)

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405611909460935.15.azuredatabricks.net
    variables:
      catalog: essentra
      schema: ${workspace.current_user.short_name}
      job_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://adb-7405611909460935.15.azuredatabricks.net
      root_path: /Workspace/Users/mikel.molinuevo@keepler.io/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: essentra
      schema: prod
      job_status: PAUSED
    permissions:
      - user_name: mikel.molinuevo@keepler.io
        level: CAN_MANAGE