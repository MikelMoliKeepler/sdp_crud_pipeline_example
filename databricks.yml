bundle:
  name: sdp-pipeline-example

include:
  - resources/*.yml

variables:
  finance:
    type: complex
    description: Parameters used in finance related pipelines
    default:
      catalog: cat_finance_dev
  
  schemas:
    type: complex
    description: Name of the schemas that will be used in the pipelines
    default:
      bronze: bronze
      silver: silver
      gold: gold
  
  job_status:
    description: Schedule of the workflow (PAUSED / UNPAUSED)

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405611909460935.15.azuredatabricks.net
    
    variables:
      finance: 
        catalog: essentra # TODO: Create the catalog as cat_finance_pro
      job_status: PAUSED

    permissions:
      # TODO: Check how to include this as a group an not nominally.
      - user_name: mikel.molinuevo@keepler.io
        level: CAN_MANAGE
      - user_name: ignacio.martinez@keepler.io
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://adb-7405611909460935.15.azuredatabricks.net
      root_path: /Workspace/Users/mikel.molinuevo@keepler.io/.bundle/${bundle.name}/${bundle.target}
    
    variables:
      finance: 
        catalog: essentra # TODO: Create the catalog as cat_finance_pro
      job_status: PAUSED

    permissions:
      # TODO: Check how to include this as a group an not nominally.
      - user_name: mikel.molinuevo@keepler.io
        level: CAN_MANAGE
      - user_name: ignacio.martinez@keepler.io
        level: CAN_MANAGE
